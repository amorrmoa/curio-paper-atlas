name: Discover curious research papers and publish

on:
  push:
    branches: [main]
  schedule:
    # Monday 10:47 JST (Monday 01:47 UTC): gently poll journal article RSS feeds.
    - cron: '47 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: curio-paper-atlas
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test selection and RSS parsing
        run: python -m unittest discover -s tests -v
      - name: Check Japanese and English journal RSS feeds
        run: python scripts/harvest_papers.py
        # The site should still deploy with its existing data if RSS is unavailable.
        continue-on-error: true
      - name: Commit refreshed paper catalogue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/papers.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: add newly discovered papers [skip ci]'
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    runs-on: ubuntu-latest
    needs: refresh
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
